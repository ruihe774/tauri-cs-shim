[package]
name = "tauri"
# Mimics upstream's 2.x major version so [patch.crates-io] = { path = ... }
# satisfies user crates that declare `tauri = "2"`. The patch line in the
# consumer's Cargo.toml is what selects the shim; the version here just has
# to be a 2.x.
version = "2.99.0"
edition.workspace = true

[dependencies]
tauri-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
