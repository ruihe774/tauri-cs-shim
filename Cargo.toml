[workspace]
resolver = "3"
members = [
    "crates/tauri",
    "crates/tauri-build",
    "crates/tauri-macros",
    "examples/basic",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tauri = { path = "crates/tauri" }
tauri-build = { path = "crates/tauri-build" }
tauri-macros = { path = "crates/tauri-macros" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "sync", "signal", "net", "time", "process"] }
axum = "0.8.9"
bytes = "1.11.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.8", features = ["cors"] }
futures-util = "0.3.32"

syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"

reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "stream"] }
